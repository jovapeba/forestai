# VERDANT AI — production nginx
# Serves the built SPA and provides same-origin proxies for the three public
# feeds that emit no CORS headers (FIRMS CSV · MeteoAlarm CAP · Hub'Eau).
# The SPA fetches these feeds via the relative paths first, so with this image
# they resolve live; a bare static host falls back to direct URLs.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/csv application/javascript application/json
             image/svg+xml text/xml application/xml application/geo+json;

  # Runtime DNS for the proxied upstreams (variable proxy_pass). The
  # entrypoint replaces __DNS_RESOLVERS__ with the container's own resolver
  # (Docker embedded DNS on compose networks, the runtime's resolver
  # elsewhere) plus public fallbacks — so upstream IP changes never require
  # an image rebuild.
  resolver __DNS_RESOLVERS__ valid=300s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ------------------------- feed proxies ------------------------------

    # NASA FIRMS active-fire CSV (~4 MB per 24h window) — no CORS upstream.
    location /firms-csv/ {
      set $firms_upstream https://firms.modaps.eosdis.nasa.gov;
      rewrite ^/firms-csv/(.*)$ /$1 break;
      proxy_pass $firms_upstream;
      proxy_ssl_server_name on;
      proxy_set_header Host firms.modaps.eosdis.nasa.gov;
      proxy_set_header User-Agent "verdant/1.0 (open environmental data viewer)";
      proxy_connect_timeout 15s;
      proxy_read_timeout 90s;
      proxy_send_timeout 30s;
    }

    # MeteoAlarm national CAP warning feeds (Europe) — no CORS upstream.
    location /meteoalarm/ {
      set $meteoalarm_upstream https://feeds.meteoalarm.org;
      rewrite ^/meteoalarm/(.*)$ /$1 break;
      proxy_pass $meteoalarm_upstream;
      proxy_ssl_server_name on;
      proxy_set_header Host feeds.meteoalarm.org;
      proxy_set_header User-Agent "verdant/1.0 (open environmental data viewer)";
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    // Hub'Eau French hydrometry — no CORS upstream (may itself 403 some
    # egress networks; the app degrades honestly in that case).
    location /hubeau/ {
      set $hubeau_upstream https://hubeau.eaufrance.fr;
      rewrite ^/hubeau/(.*)$ /$1 break;
      proxy_pass $hubeau_upstream;
      proxy_ssl_server_name on;
      proxy_set_header Host hubeau.eaufrance.fr;
      proxy_set_header User-Agent "verdant/1.0 (open environmental data viewer)";
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # CHMI Czech hydrology open data — no CORS upstream.
    location /chmi/ {
      set $chmi_upstream https://opendata.chmi.cz;
      rewrite ^/chmi/(.*)$ /$1 break;
      proxy_pass $chmi_upstream;
      proxy_ssl_server_name on;
      proxy_set_header Host opendata.chmi.cz;
      proxy_set_header User-Agent "verdant/1.0 (open environmental data viewer)";
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # GDACS global alerts — no CORS upstream.
    location /gdacs/ {
      set $gdacs_upstream https://www.gdacs.org;
      rewrite ^/gdacs/(.*)$ /$1 break;
      proxy_pass $gdacs_upstream;
      proxy_ssl_server_name on;
      proxy_set_header Host www.gdacs.org;
      proxy_set_header User-Agent "verdant/1.0 (open environmental data viewer)";
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
      proxy_send_timeout 30s;
    }

    # ------------------------- static SPA --------------------------------

    # Vite emits content-hashed bundles under /assets/ — immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    # The shell must always revalidate so a new deploy swaps asset hashes.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Health probe for container orchestrators.
    location = /healthz {
      access_log off;
      return 200 'ok\n';
    }

    # SPA fallback (hash routing means unknown paths stay client-side).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
